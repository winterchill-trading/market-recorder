name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
      - uses: winterchill-trading/infra/.github/actions/ox-setup@main
        with:
          pins: |
            fixed-decimal https://github.com/winterchill-trading/fixed-decimal.git
            exchange-core https://github.com/winterchill-trading/exchange-core.git
            hl-protocol https://github.com/winterchill-trading/hl-protocol.git
            parquet https://github.com/winterchill-trading/parquet.git
            market-data https://github.com/winterchill-trading/market-data.git
            venue-net https://github.com/winterchill-trading/venue-net.git
            hl-client https://github.com/winterchill-trading/hl-client.git
            binance-protocol https://github.com/winterchill-trading/binance-protocol.git
            mm-core https://github.com/winterchill-trading/mm-core.git
            binance-client https://github.com/winterchill-trading/binance-client.git
            bybit-protocol https://github.com/winterchill-trading/bybit-protocol.git
            bybit-client https://github.com/winterchill-trading/bybit-client.git
            okx-feed https://github.com/winterchill-trading/okx-feed.git
            coinbase-feed https://github.com/winterchill-trading/coinbase-feed.git
            kraken-feed https://github.com/winterchill-trading/kraken-feed.git
            deribit-feed https://github.com/winterchill-trading/deribit-feed.git
            bitget-feed https://github.com/winterchill-trading/bitget-feed.git
      - run: opam exec -- dune build
      - run: opam exec -- dune test
      - run: MARKET_RECORDER=_build/default/bin/main.exe scripts/test-replicate-day.sh
  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz | tar xz
          prometheus-2.53.0.linux-amd64/promtool check rules deploy/prometheus/alerts.yml
          prometheus-2.53.0.linux-amd64/promtool test rules deploy/prometheus/alerts_test.yml
